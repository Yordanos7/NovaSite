name: block_p

services:
  postgres:
    image: postgres:18
    container_name: block_p-postgres
    environment:
      POSTGRES_DB: block_p
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - block_p_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  block_p_postgres_data:
